[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnipdf"
version = "1.0.0"
description = "Advanced Layout-Preserving PDF to Word (DOCX) Converter specialized for Computer Science & Academic Papers."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "FarazanPDFConverter Developers" }
]
dependencies = [
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "pdf2docx>=0.5.8",
    "pillow>=10.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "lxml>=5.0.0",
]

[project.scripts]
omnipdf = "omnipdf.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
